<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imperia Kolonialne - Wersja Interaktywna v2</title>
    <style>
        :root {
            --bg-dark: #1a1a2e;
            --text-light: #e0e0e0;
            /* Kolory Imperiów */
            --uk-color: rgba(220, 20, 60, 0.7);     /* Czerwień brytyjska */
            --fr-color: rgba(30, 144, 255, 0.7);    /* Błękit francuski */
            --de-color: rgba(105, 105, 105, 0.8);   /* Szarość niemiecka */
            --us-color: rgba(65, 105, 225, 0.7);    /* Granat USA */
            --route-color: rgba(255, 215, 0, 0.6);  /* Złoty dla szlaków */
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
        }

        h1, h2 { text-align: center; margin: 10px 0; text-transform: uppercase; letter-spacing: 2px;}
        .subtitle { text-align: center; color: #a0a0a0; margin-bottom: 20px; }

        /* Kontener główny */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Oś czasu */
        .timeline-control {
            background: #0f0f1a;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        input[type=range] {
            width: 80%;
            margin: 15px 0;
        }

        .timeline-labels {
            display: flex;
            justify-content: space-between;
            width: 85%;
            margin: 0 auto;
            font-weight: bold;
            color: #a0a0a0;
        }
        .active-label { color: #fff; text-shadow: 0 0 10px #fff;}


        /* MAPA - To jest kluczowa sekcja */
        .map-wrapper {
            position: relative;
            width: 100%;
            /* Tło udające starą mapę - możesz tu wstawić prawdziwy obrazek w url() */
            background-image: url('https://www.transparenttextures.com/patterns/aged-paper.png'), linear-gradient(to bottom, #2c3e50, #1a1a2e); 
            background-blend-mode: overlay;
            height: 600px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.5);
            border: 3px solid #3a3a5a;
        }

        /* Bazowa mapa konturowa (dla orientacji) - bardzo subtelna */
        .base-map-svg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.2;
            pointer-events: none;
        }
        .base-land { fill: #000; stroke: #555; stroke-width: 0.5; }

        /* GŁÓWNE ELEMENTY PODŚWIETLENIA (Gradientowe Aury) */
        .aura {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px); /* Kluczowy efekt rozmycia */
            mix-blend-mode: screen; /* Sprawia, że kolory "świecą" */
            opacity: 0.6;
            transition: all 0.8s ease-in-out;
            cursor: pointer;
        }

        .aura:hover { opacity: 0.9; filter: blur(30px); transform: scale(1.1); }

        /* Style dla konkretnych państw */
        .uk-aura { background: radial-gradient(circle, var(--uk-color) 0%, transparent 70%); }
        .fr-aura { background: radial-gradient(circle, var(--fr-color) 0%, transparent 70%); }
        .de-aura { background: radial-gradient(circle, var(--de-color) 0%, transparent 70%); }
        .us-aura { background: radial-gradient(circle, var(--us-color) 0%, transparent 70%); }

        /* Pozycjonowanie aur na mapie (procentowe, aby było responsywne) */
        /* UK & Indie */
        .pos-uk { top: 15%; left: 47%; width: 10%; height: 15%; }
        .pos-india { top: 40%; left: 65%; width: 15%; height: 20%; }
        .pos-cape { top: 70%; left: 50%; width: 12%; height: 15%; } /* Kapsztad */
        
        /* Francja */
        .pos-fr-africa { top: 35%; left: 42%; width: 18%; height: 25%; } /* Afryka Zach */
        .pos-indochina { top: 45%; left: 78%; width: 8%; height: 15%; }
        
        /* Niemcy (pojawiają się później) */
        .pos-de-togo { top: 45%; left: 48%; width: 6%; height: 8%; }
        .pos-de-namibia { top: 65%; left: 48%; width: 8%; height: 10%; }

        /* USA (ekspansja) */
        .pos-usa-main { top: 25%; left: 15%; width: 25%; height: 30%; }
        .pos-usa-carib { top: 45%; left: 25%; width: 10%; height: 10%; } /* Kuba etc */
        .pos-usa-phil { top: 50%; left: 85%; width: 8%; height: 12%; } /* Filipiny */


        /* SZLAKI WODNE */
        .routes-svg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            filter: drop-shadow(0 0 5px gold);
        }
        .route-line {
            fill: none;
            stroke: var(--route-color);
            stroke-width: 2;
            stroke-dasharray: 10, 10;
            opacity: 0.5;
            animation: dashMove 30s linear infinite;
        }

        @keyframes dashMove {
            to { stroke-dashoffset: -200; }
        }

        /* LOGIKA OSI CZASU (Ukrywanie/Pokazywanie) */
        
        /* Stan domyślny (Połowa XIX w.) - ukrywamy "nowe" imperia */
        .map-wrapper[data-era="early"] .era-late-only {
            opacity: 0;
            transform: scale(0);
        }
        
        /* Stan późny (Przełom XIX/XX w.) - pokazujemy wszystko */
        .map-wrapper[data-era="late"] .era-late-only {
            opacity: 1;
            transform: scale(1);
        }

        /* Panel Informacyjny */
        #info-panel {
            background: rgba(15, 15, 26, 0.95);
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 300px;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #fff;
            backdrop-filter: blur(10px);
            transform: translateY(150%); /* Domyślnie ukryty */
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #info-panel.active { transform: translateY(0); }
        #info-title { margin: 0 0 10px 0; color: gold; }
        #info-desc { font-size: 0.9rem; line-height: 1.4; }
        .close-btn { position: absolute; top: 5px; right: 10px; cursor: pointer; font-weight: bold;}

    </style>
</head>
<body>

<div class="container">
    <h1>Rywalizacja Mocarstw</h1>
    <p class="subtitle">Wizualizacja ekspansji kolonialnej XIX/XX w.</p>

    <div class="timeline-control">
        <h2 id="era-title">Połowa XIX wieku</h2>
        <input type="range" id="timelineSlider" min="0" max="1" step="1" value="0">
        <div class="timeline-labels">
            <span id="label-early" class="active-label">← Stare Imperia (do 1870)</span>
            <span id="label-late">Nowy Imperializm (po 1870) →</span>
        </div>
    </div>

    <div class="map-wrapper" id="mainMap" data-era="early">
        
        <svg class="base-map-svg" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
             <path class="base-land" d="M100,100 Q200,50 300,100 T500,100 T700,50 T900,100 V200 H100 Z" /> <path class="base-land" d="M150,300 Q250,350 300,500 H200 Z" /> <path class="base-land" d="M450,300 Q550,350 600,550 H450 Z" /> <path class="base-land" d="M650,250 Q750,300 850,350 V200 H650 Z" /> </svg>

        <svg class="routes-svg" viewBox="0 0 1000 600">
            <path class="route-line era-late-only" d="M 480 150 Q 530 180 600 220 T 680 300" />
            <path class="route-line" d="M 200 200 Q 350 180 450 150" />
        </svg>

        <div class="aura uk-aura pos-uk" onclick="showInfo('Wielka Brytania', 'Imperium, nad którym słońce nie zachodzi. Kontrola mórz, największa flota. Metropolia.')"></div>
        <div class="aura uk-aura pos-india" onclick="showInfo('Indie Brytyjskie', '„Perła w Koronie”. Źródło bawełny, herbaty i rynek zbytu. Kluczowa kolonia.')"></div>
        <div class="aura uk-aura pos-cape" onclick="showInfo('Afryka Południowa', 'Strategiczny punkt na drodze do Indii (zanim otwarto Kanał Sueski). Kopalnie złota i diamentów.')"></div>

        <div class="aura fr-aura pos-fr-africa" onclick="showInfo('Francuska Afryka Zach.', 'Olbrzymie terytoria saharyjskie i subsaharyjskie. Misja cywilizacyjna.')"></div>
        <div class="aura fr-aura pos-indochina era-late-only" onclick="showInfo('Indochiny Francuskie', 'Dzisiejszy Wietnam, Laos, Kambodża. Ryż, kauczuk. Zdobyte w II poł. XIX w.')"></div>

        <div class="aura de-aura pos-de-togo era-late-only" onclick="showInfo('Niemieckie Kolonie', 'Togo, Kamerun. Niemcy spóźnione na podział świata żądały „miejsca pod słońcem”.')"></div>
        <div class="aura de-aura pos-de-namibia era-late-only" onclick="showInfo('Niemiecka Afryka Płd.-Zach.', 'Dzisiejsza Namibia. Brutalne tłumienie powstań (Herero i Nama).')"></div>

        <div class="aura us-aura pos-usa-main" onclick="showInfo('USA (Ekspansja Kontynentalna)', 'Realizacja „Boskiego Przeznaczenia” (Manifest Destiny). Opanowanie kontynentu od Atlantyku do Pacyfiku.')"></div>
        <div class="aura us-aura pos-usa-carib era-late-only" onclick="showInfo('Karaiby (Strefa wpływów USA)', 'Po wojnie z Hiszpanią (1898): kontrola nad Kubą i Portoryko. Budowa Kanału Panamskiego.')"></div>
        <div class="aura us-aura pos-usa-phil era-late-only" onclick="showInfo('Filipiny (USA)', 'Baza wypadowa na Pacyfik i w stronę Chin, zdobyta po 1898 roku.')"></div>

        <div id="info-panel">
            <span class="close-btn" onclick="hideInfo()">X</span>
            <h3 id="info-title">Tytuł</h3>
            <p id="info-desc">Opis</p>
        </div>

    </div>
</div>

<script>
    const slider = document.getElementById('timelineSlider');
    const mapWrapper = document.getElementById('mainMap');
    const eraTitle = document.getElementById('era-title');
    const labelEarly = document.getElementById('label-early');
    const labelLate = document.getElementById('label-late');
    const infoPanel = document.getElementById('info-panel');
    const infoTitle = document.getElementById('info-title');
    const infoDesc = document.getElementById('info-desc');

    // Obsługa Osi Czasu
    slider.addEventListener('input', function() {
        if (this.value === "0") {
            // Wczesny okres
            mapWrapper.setAttribute('data-era', 'early');
            eraTitle.innerText = "Połowa XIX wieku (Dominacja Starych Imperiów)";
            labelEarly.classList.add('active-label');
            labelLate.classList.remove('active-label');
            hideInfo(); // Ukryj info przy zmianie czasu
        } else {
            // Późny okres
            mapWrapper.setAttribute('data-era', 'late');
            eraTitle.innerText = "Przełom XIX i XX wieku (Wyścig o Afrykę i Pacyfik)";
            labelEarly.classList.remove('active-label');
            labelLate.classList.add('active-label');
            hideInfo();
        }
    });

    // Obsługa Panelu Informacyjnego
    function showInfo(title, desc) {
        infoTitle.innerText = title;
        infoDesc.innerText = desc;
        infoPanel.classList.add('active');
        // Zmiana koloru ramki panelu w zależności od imperium (opcjonalne)
        if (title.includes('Bryt')) infoPanel.style.borderLeftColor = 'var(--uk-color)';
        else if (title.includes('Franc')) infoPanel.style.borderLeftColor = 'var(--fr-color)';
        else if (title.includes('Niem')) infoPanel.style.borderLeftColor = 'var(--de-color)';
        else if (title.includes('USA')) infoPanel.style.borderLeftColor = 'var(--us-color)';
    }

    function hideInfo() {
        infoPanel.classList.remove('active');
    }

</script>

</body>
</html>
