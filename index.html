<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historyczna Mapa Imperiów 1850-1914</title>
    <style>
        :root {
            --bg-color: #05050a;
            --sidebar-bg: #0a0a15;
            --land-color: #111827;
            --border-color: #1f2937;
            
            /* KOLORY MOCARSTW */
            --uk: #ff0000; --fr: #2563eb; --de: #94a3b8; --us: #7e22ce;
            --ru: #78350f; --be: #00ffff; --it: #22c55e; --jp: #ffffff;
            --ah: #fde68a; --nl: #f97316; --pt: #f06292; --es: #fbbf24;
        }

        body {
            margin: 0;
            background: var(--bg-color);
            color: #e5e7eb;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 10px 25px;
            background: #000;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            flex-shrink: 0;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .map-section {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at center, #0a0a1f 0%, #05050a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #world-svg {
            width: 100%;
            height: 100%;
            max-width: 1200px;
            filter: drop-shadow(0 0 20px rgba(0,0,0,0.5));
        }

        .land-mass {
            fill: var(--land-color);
            stroke: var(--border-color);
            stroke-width: 0.5;
        }

        /* STYLIZACJA PUNKTÓW WEWNĄTRZ SVG */
        .glow-circle {
            opacity: 0;
            transition: opacity 0.4s ease, r 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }

        .glow-circle.active {
            opacity: 0.8;
        }

        .sidebar {
            width: 320px;
            background: var(--sidebar-bg);
            border-left: 1px solid #333;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .controls {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        #timeline {
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
            accent-color: #3b82f6;
        }

        .year-display {
            font-family: 'Courier New', monospace;
            font-size: 2.8rem;
            font-weight: bold;
            color: #fff;
        }

        .info-box {
            background: rgba(255,255,255,0.03);
            padding: 15px;
            border-radius: 8px;
            border-top: 3px solid var(--uk);
            min-height: 120px;
        }

        .legend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
            color: #94a3b8;
        }

        .dot { width: 10px; height: 10px; border-radius: 2px; }

        h3 { margin: 0 0 10px 0; font-size: 0.9rem; color: #fff; text-transform: uppercase; }
        p { margin: 0; font-size: 0.85rem; line-height: 1.5; color: #cbd5e1; }
    </style>
</head>
<body>

<header>
    <div>
        <div style="font-size: 0.6rem; color: #3b82f6; letter-spacing: 2px; font-weight: bold;">ARCHIWUM GEOPOLITYCZNE</div>
        <div style="font-size: 1.1rem; font-weight: 800; color: #fff;">MAPA IMPERIÓW 1850-1914</div>
    </div>
</header>

<div class="main-container">
    <div class="map-section">
        <svg id="world-svg" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet">
            <!-- MAPA BAZOWA -->
            <g class="land-mass">
                <path d="M110,120 L130,100 L180,80 L250,70 L310,90 L330,150 L280,220 L240,240 L220,200 L110,130 Z" />
                <path d="M260,260 L320,270 L340,300 L320,440 L270,380 L240,310 Z" />
                <path d="M440,80 L480,75 L520,70 L540,100 L530,150 L480,160 L440,150 Z" />
                <path d="M420,170 L520,165 L570,180 L590,280 L530,420 L450,300 L410,230 Z" />
                <path d="M540,70 L800,65 L930,100 L950,200 L850,280 L750,320 L650,250 L580,180 Z" />
                <path d="M800,350 L920,340 L940,430 L820,450 Z" />
            </g>
            <!-- WARSTWA IMPERIÓW (DYNAMICZNA) -->
            <g id="empire-layer"></g>
        </svg>
    </div>

    <div class="sidebar">
        <div class="controls">
            <div class="year-display" id="year-label">1850</div>
            <input type="range" id="timeline" min="1850" max="1914" value="1850">
        </div>

        <div class="info-box" id="info-box">
            <h3 id="info-title">Era Pax Britannica</h3>
            <p id="info-text">Analiza początkowa.</p>
        </div>

        <div>
            <h3>Legenda</h3>
            <div class="legend">
                <div class="legend-item"><div class="dot" style="background:var(--uk)"></div> UK</div>
                <div class="legend-item"><div class="dot" style="background:var(--fr)"></div> FR</div>
                <div class="legend-item"><div class="dot" style="background:var(--de)"></div> DE</div>
                <div class="legend-item"><div class="dot" style="background:var(--us)"></div> USA</div>
                <div class="legend-item"><div class="dot" style="background:var(--ru)"></div> RU</div>
                <div class="legend-item"><div class="dot" style="background:var(--be)"></div> BE</div>
                <div class="legend-item"><div class="dot" style="background:var(--it)"></div> IT</div>
                <div class="legend-item"><div class="dot" style="background:var(--jp)"></div> JP</div>
                <div class="legend-item"><div class="dot" style="background:var(--nl)"></div> NL</div>
                <div class="legend-item"><div class="dot" style="background:var(--pt)"></div> PT</div>
                <div class="legend-item"><div class="dot" style="background:var(--es)"></div> ES</div>
                <div class="legend-item"><div class="dot" style="background:var(--ah)"></div> A-W</div>
            </div>
        </div>
    </div>
</div>

<script>
    const slider = document.getElementById('timeline');
    const yearLabel = document.getElementById('year-label');
    const empireLayer = document.getElementById('empire-layer');

    const points = [
        // UK
        { id: 'uk_h', x: 465, y: 110, r: 12, color: 'var(--uk)', start: 1850 },
        { id: 'uk_in', x: 680, y: 265, r: 25, color: 'var(--uk)', start: 1850 },
        { id: 'uk_ca', x: 220, y: 120, r: 28, color: 'var(--uk)', start: 1850 },
        { id: 'uk_au', x: 860, y: 390, r: 25, color: 'var(--uk)', start: 1850 },
        { id: 'uk_eg', x: 530, y: 205, r: 12, color: 'var(--uk)', start: 1882 },
        { id: 'uk_sa', x: 520, y: 410, r: 15, color: 'var(--uk)', start: 1899 },
        // FR
        { id: 'fr_h', x: 480, y: 140, r: 12, color: 'var(--fr)', start: 1850 },
        { id: 'fr_af', x: 460, y: 235, r: 30, color: 'var(--fr)', start: 1880 },
        { id: 'fr_ic', x: 780, y: 275, r: 15, color: 'var(--fr)', start: 1887 },
        // RU
        { id: 'ru_h', x: 580, y: 90, r: 35, color: 'var(--ru)', start: 1850 },
        { id: 'ru_ca', x: 650, y: 175, r: 20, color: 'var(--ru)', start: 1864 },
        // US
        { id: 'us_h', x: 200, y: 170, r: 25, color: 'var(--us)', start: 1850 },
        { id: 'us_ak', x: 120, y: 75, r: 15, color: 'var(--us)', start: 1867 },
        { id: 'us_ph', x: 860, y: 275, r: 10, color: 'var(--us)', start: 1898 },
        // DE
        { id: 'de_h', x: 505, y: 110, r: 12, color: 'var(--de)', start: 1871 },
        { id: 'de_na', x: 490, y: 380, r: 10, color: 'var(--de)', start: 1884 },
        // JP
        { id: 'jp_h', x: 910, y: 175, r: 12, color: 'var(--jp)', start: 1850 },
        { id: 'jp_kr', x: 860, y: 190, r: 8, color: 'var(--jp)', start: 1910 },
        // BE
        { id: 'be_co', x: 510, y: 325, r: 20, color: 'var(--be)', start: 1885 },
        // IT
        { id: 'it_ly', x: 500, y: 220, r: 14, color: 'var(--it)', start: 1911 },
        // ES
        { id: 'es_cu', x: 265, y: 202, r: 8, color: 'var(--es)', start: 1850, end: 1898 }
    ];

    function initMap() {
        points.forEach(p => {
            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("cx", p.x);
            circle.setAttribute("cy", p.y);
            circle.setAttribute("r", 0);
            circle.setAttribute("fill", p.color);
            circle.setAttribute("class", "glow-circle");
            circle.setAttribute("id", "c-" + p.id);
            circle.style.filter = "blur(2px)";
            empireLayer.appendChild(circle);
        });
        update(1850);
    }

    function update(year) {
        yearLabel.innerText = year;
        points.forEach(p => {
            const el = document.getElementById("c-" + p.id);
            const active = year >= p.start && (!p.end || year <= p.end);
            
            if (active) {
                el.classList.add('active');
                el.setAttribute("r", p.r);
            } else {
                el.classList.remove('active');
                el.setAttribute("r", 0);
            }
        });

        const title = document.getElementById('info-title');
        const text = document.getElementById('info-text');
        const box = document.getElementById('info-box');

        if (year < 1871) {
            title.innerText = "Era Pax Britannica";
            text.innerText = "Wielka Brytania kontroluje oceany. Rosja rozszerza wpływy w Azji, a USA odbudowuje się po wojnie secesyjnej.";
            box.style.borderTopColor = 'var(--uk)';
        } else if (year < 1884) {
            title.innerText = "Zjednoczenie Niemiec";
            text.innerText = "Powstanie Cesarstwa Niemieckiego (1871) zmienia układ sił w Europie. Rozpoczyna się proces industrializacji globalnej.";
            box.style.borderTopColor = 'var(--de)';
        } else if (year < 1898) {
            title.innerText = "Konferencja Berlińska";
            text.innerText = "Mocarstwa dzielą Afrykę. Belgia przejmuje Kongo. Francja tworzy ogromne terytoria w Afryce Zachodniej.";
            box.style.borderTopColor = 'var(--be)';
        } else if (year < 1910) {
            title.innerText = "Wojna Amerykańsko-Hiszpańska";
            text.innerText = "Hiszpania traci resztki imperium (1898). USA i Japonia stają się nowymi graczami na arenie kolonialnej.";
            box.style.borderTopColor = 'var(--us)';
        } else {
            title.innerText = "Przededniu Katastrofy";
            text.innerText = "Świat jest w pełni podzielony. Lokalne konflikty (Libia, Bałkany) zwiastują wybuch I wojny światowej.";
            box.style.borderTopColor = 'var(--it)';
        }
    }

    slider.addEventListener('input', (e) => update(parseInt(e.target.value)));
    window.onload = initMap;
</script>

</body>
</html>
